name: Create Release on Tag Push

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Install Node.js
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'

        # Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        id: pnpm-install
        with:
          version: 8
          run_install: false

      # Get pnpm store directory
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      # Setup pnpm cache
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Install dependencies
      - name: Install dependencies
        run: pnpm install

      # Build for production, 这一步会生成一个 package.zip
      - name: Build for production
        run: pnpm build

      - name: Get tags and previous tag
        id: get_tags
        shell: bash
        run: |
          # best-effort fetch tags; do not fail workflow on transient fetch issues
          git fetch --force --tags origin >/dev/null 2>&1 || true

          CURRENT_TAG="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"

          # get previous tag by creation date, explicitly excluding current tag
          PREV_TAG="$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | grep -Fxv "$CURRENT_TAG" | head -n 1 || true)"

          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"
          echo "current_tag=$CURRENT_TAG"
          echo "prev_tag=${PREV_TAG:-<none>}"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG=${CURRENT_TAG}
          PREV_TAG=${PREV_TAG}
          if [ -z "$PREV_TAG" ]; then
            # no previous tag found — include recent commits (limit 100)
            git log --pretty=format:'- %s (%an)' -n 100 > changelog.txt || true
          else
            git log "$PREV_TAG..$CURRENT_TAG" --pretty=format:'- %s (%an)' > changelog.txt || true
          fi
          if [ ! -s changelog.txt ]; then
            echo "- (no commits found)" > changelog.txt
          fi
          DELIM="CHANGELOG_$(date +%s%N)"
          {
            echo "body<<$DELIM"
            cat changelog.txt
            echo
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: 'package.zip'
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          body: ${{ steps.changelog.outputs.body }}
